name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux:
    name: Core (Swift on Linux, swift-crypto)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Unit and flow tests (simulated CloudKit)
        working-directory: ios/LeuchtturmCore
        run: swift test

  ios:
    name: iOS (core on CryptoKit + CloudKit, app build + test)
    # Liquid Glass needs the iOS 26 SDK (Xcode 26). If this runner label is not
    # available on your account yet, adjust it to the newest macOS image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Core tests on macOS (also compiles the CloudKit backend)
        working-directory: ios/LeuchtturmCore
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build and test app
        working-directory: ios
        run: |
          # Newest iPhone simulator whose iOS version the active Xcode SDK supports.
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | SDK_VERSION="$SDK_VERSION" python3 -c '
          import json, os, re, sys
          sdk = tuple(int(x) for x in os.environ["SDK_VERSION"].split(".")[:2])
          best = None
          for runtime, items in json.load(sys.stdin)["devices"].items():
              m = re.search(r"\.iOS-(\d+)-(\d+)$", runtime)
              if not m:
                  continue
              v = (int(m.group(1)), int(m.group(2)))
              if v > sdk:
                  continue
              for d in items:
                  if d["name"].startswith("iPhone") and (best is None or v > best[0]):
                      best = (v, d["udid"])
          if best is None:
              sys.exit("no iPhone simulator for iOS " + os.environ["SDK_VERSION"])
          print(best[1])
          ')
          echo "Using simulator $UDID (SDK $SDK_VERSION)"
          xcodebuild test \
            -project Leuchtturm.xcodeproj \
            -scheme Leuchtturm \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Apple TV app
        working-directory: ios
        run: |
          xcodebuild build \
            -project Leuchtturm.xcodeproj \
            -scheme "Leuchtturm TV" \
            -destination "generic/platform=tvOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
