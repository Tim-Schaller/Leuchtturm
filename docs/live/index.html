<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self' https://cdn.apple-mapkit.com; connect-src https://api.apple-cloudkit.com https://*.apple-mapkit.com https://*.apple.com; img-src 'self' data: blob: https://*.apple-mapkit.com https://*.apple.com; style-src 'self' 'unsafe-inline'; font-src https://*.apple-mapkit.com; worker-src blob:">
  <title>Leuchtturm · Live</title>
  <link rel="icon" href="../assets/icon.svg">
  <link rel="stylesheet" href="live.css">
</head>
<body>
  <main>
    <header>
      <img src="../assets/icon.svg" alt="" width="40" height="40">
      <span>Leuchtturm</span>
    </header>
    <section class="card" aria-live="polite">
      <div class="person">
        <div class="avatar" id="avatar" aria-hidden="true">·</div>
        <div>
          <h1 id="title">Einen Moment …</h1>
          <p id="subtitle"></p>
        </div>
      </div>
      <div id="map" hidden></div>
      <dl id="facts" hidden>
        <div><dt id="updated-label"></dt><dd id="updated"></dd></div>
        <div><dt id="accuracy-label"></dt><dd id="accuracy"></dd></div>
        <div id="battery-row"><dt id="battery-label"></dt><dd id="battery"></dd></div>
        <div><dt id="expires-label"></dt><dd id="expires"></dd></div>
      </dl>
      <div class="actions" id="actions" hidden>
        <a id="open" class="button primary" rel="noopener noreferrer" target="_blank"></a>
        <a id="route" class="button" rel="noopener noreferrer" target="_blank"></a>
      </div>
    </section>
    <p class="note" id="note"></p>
  </main>
  <script type="module" src="live.js"></script>
</body>
</html>
