name: Leuchtturm
options:
  bundleIdPrefix: de.timschaller
  createIntermediateGroups: true
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: TW877YHM7Q
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LeuchtturmCore:
    path: LeuchtturmCore
targets:
  Leuchtturm:
    type: application
    platform: iOS
    sources:
      - Leuchtturm
      - Shared
    dependencies:
      - package: LeuchtturmCore
      - target: LeuchtturmWidgets
      - target: LeuchtturmWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    entitlements:
      path: Leuchtturm/Leuchtturm.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.de.timschaller.leuchtturm
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.healthkit: true
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.de.timschaller.leuchtturm
    info:
      path: Leuchtturm/Info.plist
      properties:
        CFBundleDisplayName: Leuchtturm
        NSSupportsLiveActivities: true
        # Only Apple's built-in encryption (CryptoKit), exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
          - fr
          - es
          - it
          - nl
          - pl
          - tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: de.timschaller.leuchtturm.invite
            CFBundleURLSchemes:
              - leuchtturm
        NSLocationWhenInUseUsageDescription: Leuchtturm zeigt deinen Standort den Leuchttürmen, in denen du bist. Er wird auf deinem iPhone verschlüsselt, bevor er es verlässt.
        NSLocationAlwaysAndWhenInUseUsageDescription: Damit deine Leuchttürme dich auch sehen, wenn die App geschlossen ist, braucht Leuchtturm den Standort im Hintergrund. Er wird auf deinem iPhone verschlüsselt, bevor er es verlässt.
        NSHealthUpdateUsageDescription: Leuchtturm schreibt nichts in Health. Es liest nur deine Schritte, wenn du „Schritte teilen“ einschaltest.
        NSHealthShareUsageDescription: Wenn du es einschaltest, teilt Leuchtturm deine Schritte von heute und der letzten Woche mit deinen Leuchttürmen, Ende-zu-Ende-verschlüsselt.
        NSMotionUsageDescription: Leuchtturm erkennt mit Bewegungsdaten, wann du fährst, um Akku zu sparen und deine Geschwindigkeit zu zeigen.
  LeuchtturmWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LeuchtturmWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: LeuchtturmWidgets/LeuchtturmWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.timschaller.leuchtturm
    info:
      path: LeuchtturmWidgets/Info.plist
      properties:
        CFBundleDisplayName: Leuchtturm
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
          - fr
          - es
          - it
          - nl
          - pl
          - tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Apple Watch: shows the snapshot the iPhone sends; no keys of its own.
  LeuchtturmWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - LeuchtturmWatch
      - path: Shared/WidgetSnapshot.swift
      - path: Shared/SnapshotAvatar.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: LeuchtturmWatch/Info.plist
      properties:
        CFBundleDisplayName: Leuchtturm
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
          - fr
          - es
          - it
          - nl
          - pl
          - tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: de.timschaller.leuchtturm
  # Apple TV: family map from an encrypted snapshot in the user's own iCloud.
  # Same bundle ID as the iPhone app, so it is one App Store purchase.
  LeuchtturmTV:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - LeuchtturmTV
      - path: Shared/WidgetSnapshot.swift
      - path: Shared/SnapshotAvatar.swift
    dependencies:
      - package: LeuchtturmCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    entitlements:
      path: LeuchtturmTV/LeuchtturmTV.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.de.timschaller.leuchtturm
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: LeuchtturmTV/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Leuchtturm
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
          - fr
          - es
          - it
          - nl
          - pl
          - tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
  LeuchtturmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LeuchtturmTests
    dependencies:
      - target: Leuchtturm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Leuchtturm:
    build:
      targets:
        Leuchtturm: all
    test:
      targets:
        - LeuchtturmTests
  Leuchtturm TV:
    build:
      targets:
        LeuchtturmTV: all
  # Debug build without iCloud: made-up people, everything in memory.
  Leuchtturm Simulation:
    build:
      targets:
        Leuchtturm: all
    run:
      config: Debug
      commandLineArguments:
        "-simulation": true
