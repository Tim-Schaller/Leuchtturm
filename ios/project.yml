name: Leuchtturm
options:
  bundleIdPrefix: de.timschaller
  createIntermediateGroups: true
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: TW877YHM7Q
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LeuchtturmCore:
    path: LeuchtturmCore
targets:
  Leuchtturm:
    type: application
    platform: iOS
    sources:
      - Leuchtturm
      - Shared
    dependencies:
      - package: LeuchtturmCore
      - target: LeuchtturmWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    entitlements:
      path: Leuchtturm/Leuchtturm.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.de.timschaller.leuchtturm
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.healthkit: true
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.de.timschaller.leuchtturm
    info:
      path: Leuchtturm/Info.plist
      properties:
        CFBundleDisplayName: Leuchtturm
        NSSupportsLiveActivities: true
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: de.timschaller.leuchtturm.invite
            CFBundleURLSchemes:
              - leuchtturm
        NSLocationWhenInUseUsageDescription: Leuchtturm zeigt deinen Standort den Kreisen, die du auswählst. Er wird auf deinem iPhone verschlüsselt, bevor er es verlässt.
        NSLocationAlwaysAndWhenInUseUsageDescription: Damit deine Kreise dich auch sehen, wenn die App geschlossen ist, braucht Leuchtturm den Standort im Hintergrund. Er wird auf deinem iPhone verschlüsselt, bevor er es verlässt.
        NSHealthShareUsageDescription: Wenn du es einschaltest, teilt Leuchtturm deine Schritte von heute und der letzten Woche mit deinen Leuchttürmen, Ende-zu-Ende-verschlüsselt.
        NSMotionUsageDescription: Leuchtturm erkennt mit Bewegungsdaten, wann du fährst, um Akku zu sparen und deine Geschwindigkeit zu zeigen.
  LeuchtturmWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LeuchtturmWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: LeuchtturmWidgets/LeuchtturmWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.timschaller.leuchtturm
    info:
      path: LeuchtturmWidgets/Info.plist
      properties:
        CFBundleDisplayName: Leuchtturm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LeuchtturmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LeuchtturmTests
    dependencies:
      - target: Leuchtturm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Leuchtturm:
    build:
      targets:
        Leuchtturm: all
    test:
      targets:
        - LeuchtturmTests
  # Debug build without iCloud: made-up people, everything in memory.
  Leuchtturm Simulation:
    build:
      targets:
        Leuchtturm: all
    run:
      config: Debug
      commandLineArguments:
        "-simulation": true
