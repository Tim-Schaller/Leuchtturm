name: Leuchtturm
options:
  bundleIdPrefix: de.timschaller
  createIntermediateGroups: true
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LeuchtturmCore:
    path: LeuchtturmCore
targets:
  Leuchtturm:
    type: application
    platform: iOS
    sources:
      - Leuchtturm
    dependencies:
      - package: LeuchtturmCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Leuchtturm/Leuchtturm.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.de.timschaller.leuchtturm
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: Leuchtturm/Info.plist
      properties:
        CFBundleDisplayName: Leuchtturm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        CFBundleURLTypes:
          - CFBundleURLName: de.timschaller.leuchtturm.invite
            CFBundleURLSchemes:
              - leuchtturm
        NSLocationWhenInUseUsageDescription: Leuchtturm shows your location to the circles you choose, end-to-end encrypted.
        NSLocationAlwaysAndWhenInUseUsageDescription: Leuchtturm needs background location so the people in your circles can see where you are, even when the app is closed. Your location is encrypted on your device before it is sent.
        NSMotionUsageDescription: Leuchtturm uses motion data to detect when you are driving, so it can show your speed and save battery while you are standing still.
  LeuchtturmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LeuchtturmTests
    dependencies:
      - target: Leuchtturm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timschaller.leuchtturm.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Leuchtturm:
    build:
      targets:
        Leuchtturm: all
    test:
      targets:
        - LeuchtturmTests
