services:
  leuchtturmd:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LEUCHTTURM_ADDR: ":8080"
      LEUCHTTURM_DATA_DIR: /data
    volumes:
      - leuchtturm-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  leuchtturm-data:
